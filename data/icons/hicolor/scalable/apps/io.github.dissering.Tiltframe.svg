  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="#111d30" stroke="#304361" stroke-width="2"/>
  <path d="M17 42V28l11-11h14m44 94h14l11-11V86" fill="none" stroke="#6ddbd3" stroke-width="3" stroke-linecap="round"/>
  <use href="#shape" transform="translate(24 27) scale(3.33333)" fill="#12758b"/>
