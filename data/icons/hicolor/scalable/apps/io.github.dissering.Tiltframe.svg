<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="title">
  <title id="title">Tiltframe</title>
  <desc>A mint tilted tile on a midnight blue frame, based on the Roblox icon from TheSVG.</desc>
  <defs>
    <linearGradient id="tile" x1="18" y1="15" x2="105" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b6fff1"/>
      <stop offset=".55" stop-color="#60dfcf"/>
      <stop offset="1" stop-color="#1fa6c4"/>
    </linearGradient>
    <path id="shape" fill-rule="evenodd" d="M18.926 23.998 0 18.892 5.075.002 24 5.108ZM15.348 10.09l-5.282-1.453-1.414 5.273 5.282 1.453z"/>
    <clipPath id="tile-clip">
      <use href="#shape" transform="translate(24 21) scale(3.33333)"/>
